spring.application.name=Internship_API_Gateway
server.port=8084

spring.main.web-application-type=reactive

management.endpoints.web.exposure.include=gateway,env,health
management.endpoint.gateway.enabled=true

logging.level.org.springframework.cloud.gateway=TRACE

services.auth.url=${AUTH_SERVICE_URL}
services.user.url=${USER_SERVICE_URL}
services.order.url=${ORDER_SERVICE_URL}
services.payment.url=${PAYMENT_SERVICE_URL}